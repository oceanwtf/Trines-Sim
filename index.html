<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trines Sim</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: white;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            grid-template-rows: repeat(5, 50px);
            gap: 5px;
            margin: 20px;
            position: relative;
        }

        .cell {
            width: 50px;
            height: 50px;
            background-color: #2c2c3c;
            border: 1px solid #3a3a4c;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .cell:hover {
            background-color: #3b3b4b;
        }

        /* Valid cells highlighted when selection is active */
        .cell.allowed-active {
            border-color: #aaaaff;
        }

        .cell.allowed-active:hover {
            background-color: #3b3b5b;
        }

        /* Cells outside the allowed area are dimmed during selection */
        .cell.dimmed {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Keyboard navigation focus ring */
        .cell.focused {
            outline: 2px solid #ffcc00;
            outline-offset: -2px;
            z-index: 3;
        }

        .pattern {
            position: absolute;
            border-radius: 50%;
            background-color: blue;
            width: 100%;
            height: 100%;
            top: -100px;
            left: 0;
            opacity: 0.5;
            animation: dropIn 1s ease-in-out forwards, fadeOut 1s ease-in-out 1s forwards;
        }

        .pattern.final {
            animation: dropIn 1s ease-in-out forwards;
        }

        @keyframes dropIn {
            from { top: -100px; opacity: 0; }
            to   { top: 0;      opacity: 0.5; }
        }

        @keyframes fadeOut {
            from { opacity: 0.5; }
            to   { opacity: 0; }
        }

        .selected {
            border: 2px solid white;
            z-index: 2;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #007acc;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background-color: #005f99;
        }

        #auto-repeat-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
            user-select: none;
        }

        #instructions {
            font-size: 18px;
        }

        #pattern-order-reveal {
            font-size: 14px;
            color: #aaaacc;
            min-height: 1.4em;
            margin: 0;
        }

        #keyboard-hint {
            font-size: 12px;
            color: #666677;
            margin: 4px 0 12px;
        }

        #result {
            font-size: 18px;
            min-height: 1.4em;
            margin: 4px 0;
        }

        #result.success { color: #4caf50; }
        #result.failure { color: #f44336; }
        #result.info    { color: white; }
    </style>
</head>
<body>
    <h1>Trines Sim</h1>
    <button id="start-button" onclick="startMechanic()">Start Mechanic</button>
    <label id="auto-repeat-label">
        <input type="checkbox" id="auto-repeat"> Auto-repeat
    </label>
    <div id="grid"></div>
    <p id="instructions">Pick your path. Your 1st selection is where you will start and your 2nd selection is where you will move to.</p>
    <p id="pattern-order-reveal"></p>
    <p id="keyboard-hint">[Space] Start &nbsp;·&nbsp; [Arrow keys] Navigate &nbsp;·&nbsp; [Enter] Select</p>
    <button id="reset-button" onclick="resetCounter()">Reset Counter</button>
    <p>Correct Dodges: <span id="correct-count">0</span></p>
    <p>Incorrect Dodges: <span id="incorrect-count">0</span></p>
    <p>Streak: <span id="streak-count">0</span></p>
    <p id="result"></p>

    <script>
        const gridEl = document.getElementById('grid');
        const instructionsText = document.getElementById('instructions');
        const resultText = document.getElementById('result');
        const patternOrderReveal = document.getElementById('pattern-order-reveal');
        const correctCountText = document.getElementById('correct-count');
        const incorrectCountText = document.getElementById('incorrect-count');
        const streakCountText = document.getElementById('streak-count');
        const startButton = document.getElementById('start-button');
        const autoRepeatCheckbox = document.getElementById('auto-repeat');

        let correctCount = 0;
        let incorrectCount = 0;
        let streakCount = 0;
        let selectedPath = [];
        let patternOrder = [];
        let interactionEnabled = false;

        const patterns = {
            A: [0, 4, 8, 11, 12, 13, 16, 20, 24],
            B: [2, 5, 6, 14, 15, 17, 21, 23],
            C: [1, 3, 7, 9, 10, 18, 19, 22]
        };

        // The 2x2 playable area using FFXIV positional markers:
        //   MID(12)  1(13)
        //    3(17)   4(18)
        const allowedGrid = [12, 13, 17, 18];

        // Arrow-key navigation map: allowedGrid index -> {key: next index}
        const arrowNav = {
            0: { ArrowRight: 1, ArrowDown: 2 },
            1: { ArrowLeft: 0, ArrowDown: 3 },
            2: { ArrowUp: 0,   ArrowRight: 3 },
            3: { ArrowUp: 1,   ArrowLeft: 2 }
        };

        // Current keyboard focus position within allowedGrid (0–3)
        let focusedAllowedIndex = 0;

        // Build the 5x5 grid
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = i;
            if (i === 12) cell.innerText = 'MID';
            if (i === 13) cell.innerText = '1';
            if (i === 17) cell.innerText = '3';
            if (i === 18) cell.innerText = '4';
            cell.addEventListener('click', () => handleCellClick(i));
            gridEl.appendChild(cell);
        }

        function clearPatternOverlays() {
            gridEl.querySelectorAll('.pattern').forEach(el => el.remove());
        }

        function startMechanic() {
            instructionsText.innerText = 'Pick your path. Your 1st selection is where you will start and your 2nd selection is where you will move to.';
            resultText.innerText = '';
            resultText.className = '';
            patternOrderReveal.innerText = '';
            selectedPath = [];
            interactionEnabled = false;
            startButton.disabled = true;
            focusedAllowedIndex = 0;

            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('selected', 'allowed-active', 'dimmed', 'focused');
            });
            clearPatternOverlays();

            patternOrder = ['A', 'B', 'C'].sort(() => Math.random() - 0.5);

            let delay = 0;
            patternOrder.forEach((pattern, index) => {
                const isFinal = index === patternOrder.length - 1;
                setTimeout(() => {
                    clearPatternOverlays();
                    showPattern(pattern, isFinal);
                    if (isFinal) {
                        setTimeout(() => {
                            interactionEnabled = true;
                            startButton.disabled = false;
                            applySelectionHighlight();
                        }, 1000);
                    }
                }, delay);
                delay += 2000;
            });
        }

        function showPattern(pattern, isFinal) {
            patterns[pattern].forEach(index => {
                const circle = document.createElement('div');
                circle.classList.add('pattern');
                if (isFinal) circle.classList.add('final');
                gridEl.children[index].appendChild(circle);
            });
        }

        function applySelectionHighlight() {
            document.querySelectorAll('.cell').forEach(cell => {
                const idx = parseInt(cell.dataset.index);
                if (allowedGrid.includes(idx)) {
                    cell.classList.add('allowed-active');
                    cell.classList.remove('dimmed');
                } else {
                    cell.classList.add('dimmed');
                    cell.classList.remove('allowed-active');
                }
            });
            updateKeyboardFocus();
        }

        function clearSelectionHighlight() {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('allowed-active', 'dimmed', 'focused');
            });
        }

        function updateKeyboardFocus() {
            document.querySelectorAll('.cell').forEach(cell => cell.classList.remove('focused'));
            if (interactionEnabled && selectedPath.length < 2) {
                gridEl.children[allowedGrid[focusedAllowedIndex]].classList.add('focused');
            }
        }

        function handleCellClick(index) {
            if (!interactionEnabled || selectedPath.length >= 2) return;
            if (!allowedGrid.includes(index)) return;

            selectedPath.push(index);
            gridEl.children[index].classList.add('selected');
            focusedAllowedIndex = allowedGrid.indexOf(index);

            if (selectedPath.length === 2) {
                interactionEnabled = false;
                clearSelectionHighlight();
                validateDodge();
            } else {
                updateKeyboardFocus();
            }
        }

        function recordResult(success, message) {
            resultText.innerText = message;
            resultText.className = success ? 'success' : 'failure';

            if (success) {
                correctCount++;
                streakCount++;
            } else {
                incorrectCount++;
                streakCount = 0;
            }

            correctCountText.innerText = correctCount;
            incorrectCountText.innerText = incorrectCount;
            streakCountText.innerText = streakCount;
            patternOrderReveal.innerText = `Pattern order was: ${patternOrder.join(' → ')}`;

            if (autoRepeatCheckbox.checked) {
                setTimeout(startMechanic, 1500);
            }
        }

        function validateDodge() {
            const firstPattern = patternOrder[0];
            const lastPattern = patternOrder[patternOrder.length - 1];
            const rowDiff = Math.abs(Math.floor(selectedPath[1] / 5) - Math.floor(selectedPath[0] / 5));
            const colDiff = Math.abs((selectedPath[1] % 5) - (selectedPath[0] % 5));

            if (rowDiff === 1 && colDiff === 1) {
                recordResult(false, 'Diagonal dodges are invalid.');
                return;
            }

            if (!allowedGrid.includes(selectedPath[0]) || !allowedGrid.includes(selectedPath[1])) {
                recordResult(false, 'You must stay within the markers to stay with your team.');
                return;
            }

            if (patterns[lastPattern].includes(selectedPath[0]) && patterns[firstPattern].includes(selectedPath[1])) {
                recordResult(true, 'Success!');
            } else {
                recordResult(false, 'You Died!');
            }
        }

        function resetCounter() {
            correctCount = 0;
            incorrectCount = 0;
            streakCount = 0;
            correctCountText.innerText = 0;
            incorrectCountText.innerText = 0;
            streakCountText.innerText = 0;
            resultText.innerText = 'Counters have been reset.';
            resultText.className = 'info';
            setTimeout(() => {
                resultText.innerText = '';
                resultText.className = '';
            }, 1000);
        }

        // Keyboard support
        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!startButton.disabled) startMechanic();
                return;
            }

            if (!interactionEnabled || selectedPath.length >= 2) return;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const next = arrowNav[focusedAllowedIndex]?.[e.key];
                if (next !== undefined) {
                    focusedAllowedIndex = next;
                    updateKeyboardFocus();
                }
                return;
            }

            if (e.code === 'Enter' || e.code === 'NumpadEnter') {
                e.preventDefault();
                handleCellClick(allowedGrid[focusedAllowedIndex]);
            }
        });
    </script>
</body>
</html>
